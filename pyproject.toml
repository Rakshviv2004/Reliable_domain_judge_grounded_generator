[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingestion*", "retrieval*", "generator*", "judge*", "orchestrator*", "evaluation*", "api*", "monitoring*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["datasketch.*", "pdfplumber.*", "bs4.*", "wandb.*"]
ignore_missing_imports = true
