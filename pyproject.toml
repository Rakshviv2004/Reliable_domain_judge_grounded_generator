[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reliable-domain-judge"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = [
    "ingestion*",
    "retrieval*",
    "generator*",
    "judge*",
    "orchestrator*",
    "evaluation*",
    "api*",
    "monitoring*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["datasketch.*", "pdfplumber.*", "bs4.*", "wandb.*"]
ignore_missing_imports = true
